[project]
name = "comfyui-pluribus"
version = "0.4.0"
description = "People, intended-use, and recipient-confirmation workflow inside ComfyUI — the Pluribus talent layer."
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.optional-dependencies]
# Kept optional to avoid forcing a large native wheel or a NumPy change into
# every ComfyUI install. The panel detects this capability and keeps graph-only
# source review available when the local vision backend is not installed.
identity = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
]

[project.urls]
Homepage = "https://trypluribus.com/?src=comfyui"
Repository = "https://github.com/trypluribus/comfyui-pluribus"
Issues = "https://github.com/trypluribus/comfyui-pluribus/issues"

# Comfy Registry metadata. PublisherId must match the publisher account
# created at registry.comfy.org before `comfy node publish`.
[tool.comfy]
PublisherId = "pluribus"
DisplayName = "Pluribus — Rights Scan & Talent Records"
Icon = "https://trypluribus.com/brand/app-icons/icon-amber-bg-512.png"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
