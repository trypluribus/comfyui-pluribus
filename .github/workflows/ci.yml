name: ComfyUI plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfyui-plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Test Python package
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -v -p no:cacheprovider

  browser-contracts:
    name: Browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test browser contracts
        run: npm test

  required:
    name: Plugin CI
    if: always()
    needs: [python-tests, browser-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Python and browser contracts
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-contracts.result }}
        run: |
          if [[ "$PYTHON_RESULT" != 'success' || "$BROWSER_RESULT" != 'success' ]]; then
            printf 'Required plugin lane failed: python=%s browser=%s\n' \
              "$PYTHON_RESULT" "$BROWSER_RESULT" >&2
            exit 1
          fi
