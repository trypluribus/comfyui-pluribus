name: ComfyUI plugin CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: comfyui-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Test Python package
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -v -p no:cacheprovider

      - name: Test browser contracts
        run: node --test web/tests/contracts.test.mjs
